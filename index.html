<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just Us</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d12;color:#f4f4f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100vh}
.app{height:100vh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#121219}
header{padding:18px 20px;border-bottom:1px solid #282832;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:#fff;color:#111;display:grid;place-items:center;font-weight:800}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#8f8f9c;margin-top:2px}
.messages{flex:1;overflow:auto;padding:22px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:11px 14px;border-radius:18px;line-height:1.35;font-size:15px}
.me{align-self:flex-end;background:#f4f4f7;color:#111;border-bottom-right-radius:5px}
.them{align-self:flex-start;background:#24242e;border-bottom-left-radius:5px}
.time{font-size:10px;opacity:.5;margin-top:4px;text-align:right}
.composer{padding:12px;border-top:1px solid #282832;display:flex;gap:8px}
input{flex:1;background:#20202a;color:#fff;border:1px solid #30303b;border-radius:16px;padding:13px 15px;outline:none}
button{border:0;border-radius:16px;padding:0 18px;background:#fff;color:#111;font-weight:700}
.note{text-align:center;color:#777784;font-size:11px;padding:0 15px 10px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">JU</div>
  <div><h1>Just Us</h1><div class="sub">Notre petit espace de discussion</div></div>
</header>
<main class="messages" id="messages">
  <div class="msg them">Bienvenue sur Just Us 👋<div class="time">maintenant</div></div>
</main>
<div class="note">Prototype local — les messages ne sont pas encore synchronisés entre appareils.</div>
<form class="composer" id="form">
  <input id="input" autocomplete="off" placeholder="Écrire un message…">
  <button>Envoyer</button>
</form>
</div>
<script>
const form=document.getElementById('form'), input=document.getElementById('input'), messages=document.getElementById('messages');
form.addEventListener('submit',e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 const d=document.createElement('div'); d.className='msg me';
 d.innerHTML=text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'<div class="time">maintenant</div>';
 messages.appendChild(d); input.value=''; messages.scrollTop=messages.scrollHeight;
});
</script>
</body>
</html>
